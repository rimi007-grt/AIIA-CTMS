version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm --prefix server install
      - npm --prefix client install
      - npm --prefix client run build
run:
  command: node server/index.js
  network:
    port: 5000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: 5000
    - name: JWT_SECRET
      value: aayu_setu_ctms_aws_jwt_secret_key_prod
