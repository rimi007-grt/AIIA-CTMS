services:
  - type: web
    name: aayu-setu-ctms
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: aayu_setu_ctms_production_secret_key_prod
